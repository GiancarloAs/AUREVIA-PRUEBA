<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AUREVIA · Gestión de solicitudes</title>
<!-- Página privada: no se enlaza desde el sitio ni debe aparecer en buscadores -->
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<!-- Solo se permite código y estilos de esta carpeta, y conexión únicamente con la base de datos -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://ddxuhxuwsnygwidutuhs.supabase.co; base-uri 'none'; form-action 'none'">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="panel.css">
</head>
<body>

<main id="vista-login" class="login" hidden>
  <form id="form-login" class="login-card" novalidate>
    <p class="marca">AUREVIA</p>
    <h1>Gestión de solicitudes</h1>
    <label for="correo">Correo</label>
    <input id="correo" name="correo" type="email" autocomplete="username" required>
    <label for="clave">Contraseña</label>
    <input id="clave" name="clave" type="password" autocomplete="current-password" required>
    <button type="submit" class="btn" id="btn-entrar">Ingresar</button>
    <p class="aviso" id="login-aviso" role="alert" hidden></p>
  </form>
</main>

<div id="vista-panel" hidden>
  <header class="barra">
    <p class="marca">AUREVIA</p>
    <div class="barra-der">
      <span id="usuario"></span>
      <button type="button" class="btn btn-claro" id="btn-salir">Cerrar sesión</button>
    </div>
  </header>

  <main class="panel">
    <div class="cabecera">
      <div>
        <h1>Solicitudes</h1>
        <p id="resumen" class="resumen" aria-live="polite"></p>
      </div>
      <div class="acciones">
        <label class="oculto" for="buscar">Buscar</label>
        <input id="buscar" type="search" placeholder="Buscar por nombre, correo, país…" autocomplete="off">
        <button type="button" class="btn btn-claro" id="btn-actualizar">Actualizar</button>
        <button type="button" class="btn" id="btn-excel">Descargar Excel</button>
      </div>
    </div>

    <p class="aviso" id="panel-aviso" role="alert" hidden></p>

    <div class="tabla-wrap" tabindex="0" aria-label="Tabla de solicitudes">
      <table>
        <thead><tr id="tabla-cabeza"></tr></thead>
        <tbody id="tabla-cuerpo"></tbody>
      </table>
    </div>
    <p class="vacio" id="vacio" hidden>Todavía no hay solicitudes.</p>
  </main>
</div>

<noscript><p class="aviso">Esta página necesita JavaScript.</p></noscript>
<script src="xlsx.mini.min.js"></script>
<script src="panel.js"></script>
</body>
</html>
